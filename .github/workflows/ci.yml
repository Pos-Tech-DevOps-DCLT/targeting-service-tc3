name: CI — targeting-service

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:

  build-and-test:
    name: "1 · Build & Testes Unitários"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-test.txt
      - name: Executar testes com cobertura
        run: |
          pytest tests/ -v \
            --junitxml=test-results.xml \
            --cov=. \
            --cov-report=xml:coverage.xml
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost/fake"
          AUTH_SERVICE_URL: "http://fake-auth"
      - name: Publicar resultados dos testes
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
      - name: Publicar cobertura
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: coverage.xml
          format: markdown
          output: both
      - name: Complexidade ciclomática (radon)
        if: always()
        run: radon cc app.py -s -a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeting-test-reports
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  lint:
    name: "2 · Lint / Análise Estática"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8==7.1.1
      - name: Executar flake8
        run: flake8 app.py --max-line-length=120 --statistics || true

  docker-build:
    name: "3 · Docker Build"
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: targeting-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/flag-service.tar
      - uses: actions/upload-artifact@v4
        with:
          name: targeting-docker-image
          path: /tmp/targeting-service.tar
          retention-days: 1

  trivy-scan:
    name: "4 · Scan de Vulnerabilidades (Trivy)"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: targeting-docker-image
          path: /tmp
      - run: docker load --input /tmp/targeting-service.tar
      - name: Trivy — scan e publicar no Job Summary
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: targeting-service:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
      - name: Trivy — salvar relatório JSON
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: targeting-service:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeting-trivy-report
          path: trivy-report.json
          retention-days: 30

  push-ecr:
    name: "5 · Push para AWS ECR"
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        with:
          name: targeting-docker-image
          path: /tmp
      - run: docker load --input /tmp/targeting-service.tar
      - name: Tag e push para ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-prod/targeting-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          docker tag targeting-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          echo "✅ Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA" >> $GITHUB_STEP_SUMMARY